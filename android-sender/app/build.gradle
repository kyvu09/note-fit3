plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kyvu.fit3notessender'
    compileSdk 35

    defaultConfig {
        applicationId "com.kyvu.fit3notessender"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
